name: Practice-workflow
on: push

jobs:
  Code-checkout:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check python version
        run: python --version
      - name: Run python file
        run: python abc.py

  Running-pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check python version
        run: python --version
      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Run pytest
        run: |
          pytest -v \
          --junitxml=test-results.xml \
          --log-file=pytest.log \
          --log-file-level=DEBUG \
          2>&1 | tee output.log
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-reports
          path: |
            pytest.log
            output.log
            test-results.xml
          if-no-files-found: warn